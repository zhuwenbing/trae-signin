name: TRAE 每日签到

on:
  schedule:
    # GitHub cron 使用 UTC，且整点附近容易排队/延迟，这里错开 10 分钟。
    # 主签到：北京时间 08:10（UTC 00:10）
    # 兜底签到：北京时间 16:10（UTC 08:10）
    # 主签到成功后，兜底任务会自动跳过（不调用接口、不发通知）。
    - cron: '10 0 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch: # 支持手动触发；手动触发不受“今日已成功”标记限制

permissions:
  contents: read

jobs:
  check:
    # 仅定时触发时检查今日是否已成功签到；手动触发直接执行
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.marker.outputs.cache-hit }}
    steps:
      - name: 计算今日日期
        id: date
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 查找今日成功标记
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .signin-ok
          key: trae-signin-ok-${{ steps.date.outputs.today }}
          lookup-only: true
        # 缓存服务异常时按“未成功”处理，保证兜底仍会执行
        continue-on-error: true

      - name: 输出检查结果
        run: |
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "今日已成功签到，跳过兜底任务（不调用 TRAE 接口、不发送通知）"
          else
            echo "今日尚未成功签到，继续执行"
          fi

  signin:
    needs: check
    if: |
      always() &&
      (github.event_name != 'schedule' ||
       needs.check.outputs.skip != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        env:
          AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
        run: |
          mkdir -p auths
          # 仅在对应 Secret 已配置时生成，避免空文件被当成失败账号
          if [ -n "$AUTH_1" ]; then printf '%s\n' "$AUTH_1" > auths/trae-1.json; fi
          if [ -n "$AUTH_2" ]; then printf '%s\n' "$AUTH_2" > auths/trae-2.json; fi
          # 如需更多账号，按同样方式添加 TRAE_AUTH_N

      - name: 随机延迟
        if: github.event_name == 'schedule'
        run: |
          # 定时触发时随机等待 1~15 分钟，避免每天签到时间完全一致。
          # 手动触发不等待，方便调试。
          DELAY=$((RANDOM % 840 + 60))
          echo "定时触发，随机等待 ${DELAY}s 后开始签到"
          sleep "$DELAY"

      - name: 执行签到
        run: |
          OUTPUT=$(./signin_bin auths 2>&1)
          echo "$OUTPUT"
          echo "SIGNIN_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 提取结果
        id: result
        run: |
          echo "$SIGNIN_OUTPUT" | grep -oP '总计=\K\d+' | head -1 | xargs -I{} echo "total={}" >> $GITHUB_OUTPUT || echo "total=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '签到成功=\K\d+' | head -1 | xargs -I{} echo "ok={}" >> $GITHUB_OUTPUT || echo "ok=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '已签=\K\d+' | head -1 | xargs -I{} echo "already={}" >> $GITHUB_OUTPUT || echo "already=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '禁用=\K\d+' | head -1 | xargs -I{} echo "disabled={}" >> $GITHUB_OUTPUT || echo "disabled=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '未确认=\K\d+' | head -1 | xargs -I{} echo "unconf={}" >> $GITHUB_OUTPUT || echo "unconf=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '设备异常=\K\d+' | head -1 | xargs -I{} echo "busy={}" >> $GITHUB_OUTPUT || echo "busy=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '失败=\K\d+' | head -1 | xargs -I{} echo "fail={}" >> $GITHUB_OUTPUT || echo "fail=?" >> $GITHUB_OUTPUT
          # 只有 token 真正刷新过才需要回写 Secret
          if echo "$SIGNIN_OUTPUT" | grep -q "token 刷新成功"; then
            echo "refreshed=1" >> $GITHUB_OUTPUT
          else
            echo "refreshed=0" >> $GITHUB_OUTPUT
          fi

      - name: 判断本次是否成功
        id: success
        run: |
          FAIL='${{ steps.result.outputs.fail }}'
          UNCONF='${{ steps.result.outputs.unconf }}'
          BUSY='${{ steps.result.outputs.busy }}'
          OK='${{ steps.result.outputs.ok }}'
          ALREADY='${{ steps.result.outputs.already }}'
          is_num() { case "$1" in ''|*[!0-9]*) return 1 ;; *) return 0 ;; esac; }
          if is_num "$FAIL" && is_num "$UNCONF" && is_num "$BUSY" && is_num "$OK" && is_num "$ALREADY" &&
             [ "$FAIL" -eq 0 ] && [ "$UNCONF" -eq 0 ] && [ "$BUSY" -eq 0 ] &&
             { [ "$OK" -gt 0 ] || [ "$ALREADY" -gt 0 ]; }; then
            echo "success=1" >> "$GITHUB_OUTPUT"
          else
            echo "success=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 计算今日日期
        id: date
        run: echo "today=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: 记录今日成功标记
        if: always() && steps.success.outputs.success == '1'
        run: |
          TZ=Asia/Shanghai date +%F > .signin-ok
          echo "已记录今日成功标记：$(cat .signin-ok)"

      - name: 保存今日成功标记
        if: always() && steps.success.outputs.success == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .signin-ok
          key: trae-signin-ok-${{ steps.date.outputs.today }}

      - name: Server酱 / Bark 通知
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SERVERCHAN_API: ${{ secrets.SERVERCHAN_API }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ] && [ -z "$BARK_URL" ]; then
            echo "未配置 SERVERCHAN_SENDKEY / BARK_URL，跳过通知"
            exit 0
          fi
          TITLE="✅ TRAE签到"
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 禁用${{ steps.result.outputs.disabled }} 未确认${{ steps.result.outputs.unconf }} 设备异常${{ steps.result.outputs.busy }} 失败${{ steps.result.outputs.fail }}"
          if [ "${{ steps.result.outputs.busy }}" -gt 0 ] 2>/dev/null; then
            TITLE="🔑 TRAE设备号异常"
          fi
          if [ "${{ steps.result.outputs.unconf }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到未确认"
          fi
          if [ "${{ steps.result.outputs.fail }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
          fi

          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            API="${SERVERCHAN_API:-https://sctapi.ftqq.com}"
            API="${API%/}"
            if curl -fsS -X POST "$API/$SERVERCHAN_SENDKEY.send" \
                --data-urlencode "title=$TITLE" \
                --data-urlencode "desp=$BODY" >/dev/null 2>&1; then
              echo "Server酱通知已发送"
            else
              echo "Server酱通知发送失败，请检查 SERVERCHAN_SENDKEY / SERVERCHAN_API"
            fi
          fi

          if [ -n "$BARK_URL" ]; then
            BARK_URL="${BARK_URL%/}"
            urlencode() {
              printf '%s' "$1" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g'
            }
            if curl -fsS "$BARK_URL/$(urlencode "$TITLE")/$(urlencode "$BODY")" >/dev/null 2>&1; then
              echo "Bark通知已发送"
            else
              echo "Bark通知发送失败，请检查 BARK_URL"
            fi
          fi

      # 可选：refreshToken 会随刷新轮换，用 GH_PAT 把新凭证写回 Secrets。
      # GH_PAT 需具备 secrets: write 权限（fine-grained）或 repo 权限（classic）。
      # 仅在本次运行真正刷新过 token 时才回写；未刷新则跳过。
      - name: 回写刷新后的凭证
        if: always() && steps.result.outputs.refreshed == '1'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT，跳过凭证回写"
            exit 0
          fi
          shopt -s nullglob
          for f in auths/trae-*.json; do
            [ -s "$f" ] || continue
            name="TRAE_AUTH_$(basename "$f" .json | sed 's/^trae-//')"
            gh secret set "$name" --body "$(cat "$f")"
            echo "已更新 Secret: $name"
          done

      - name: 清理凭证
        if: always()
        run: rm -rf auths
