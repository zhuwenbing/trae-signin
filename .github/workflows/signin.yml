name: TRAE 每日签到

on:
  schedule:
    # 每天 00:00 UTC = 08:00 北京时间
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        env:
          AUTH_1: ${{ secrets.TRAE_AUTH_1 }}
          AUTH_2: ${{ secrets.TRAE_AUTH_2 }}
        run: |
          mkdir -p auths
          # 仅在对应 Secret 已配置时生成，避免空文件被当成失败账号
          if [ -n "$AUTH_1" ]; then printf '%s\n' "$AUTH_1" > auths/trae-1.json; fi
          if [ -n "$AUTH_2" ]; then printf '%s\n' "$AUTH_2" > auths/trae-2.json; fi
          # 如需更多账号，按同样方式添加 TRAE_AUTH_N

      - name: 执行签到
        run: |
          OUTPUT=$(./signin_bin auths 2>&1)
          echo "$OUTPUT"
          echo "SIGNIN_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 提取结果
        id: result
        run: |
          echo "$SIGNIN_OUTPUT" | grep -oP '总计=\K\d+' | head -1 | xargs -I{} echo "total={}" >> $GITHUB_OUTPUT || echo "total=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '签到成功=\K\d+' | head -1 | xargs -I{} echo "ok={}" >> $GITHUB_OUTPUT || echo "ok=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '已签=\K\d+' | head -1 | xargs -I{} echo "already={}" >> $GITHUB_OUTPUT || echo "already=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '禁用=\K\d+' | head -1 | xargs -I{} echo "disabled={}" >> $GITHUB_OUTPUT || echo "disabled=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '未确认=\K\d+' | head -1 | xargs -I{} echo "unconf={}" >> $GITHUB_OUTPUT || echo "unconf=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '设备异常=\K\d+' | head -1 | xargs -I{} echo "busy={}" >> $GITHUB_OUTPUT || echo "busy=0" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '失败=\K\d+' | head -1 | xargs -I{} echo "fail={}" >> $GITHUB_OUTPUT || echo "fail=?" >> $GITHUB_OUTPUT

      - name: Bark 通知
        if: always()
        run: |
          TITLE="✅ TRAE签到"
          BODY="总计${{ steps.result.outputs.total }} 成功${{ steps.result.outputs.ok }} 已签${{ steps.result.outputs.already }} 禁用${{ steps.result.outputs.disabled }} 未确认${{ steps.result.outputs.unconf }} 设备异常${{ steps.result.outputs.busy }} 失败${{ steps.result.outputs.fail }}"
          if [ "${{ steps.result.outputs.busy }}" -gt 0 ] 2>/dev/null; then
            TITLE="🔑 TRAE设备号异常"
          fi
          if [ "${{ steps.result.outputs.unconf }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到未确认"
          fi
          if [ "${{ steps.result.outputs.fail }}" -gt 0 ] 2>/dev/null; then
            TITLE="⚠️ TRAE签到异常"
          fi
          # URL 编码
          TITLE_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$TITLE'))")
          BODY_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BODY'))")
          curl -s -X POST "${{ secrets.BARK_URL }}/${TITLE_ENC}/${BODY_ENC}" || true

      # 可选：refreshToken 会随刷新轮换，用 GH_PAT 把新凭证写回 Secrets。
      # GH_PAT 需具备 secrets: write 权限（fine-grained）或 repo 权限（classic）。
      # 不配置则跳过；refreshToken 轮换后旧 Secret 会失效，需要重新登录。
      - name: 回写刷新后的凭证
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 GH_PAT，跳过凭证回写"
            exit 0
          fi
          shopt -s nullglob
          for f in auths/trae-*.json; do
            [ -s "$f" ] || continue
            name="TRAE_AUTH_$(basename "$f" .json | sed 's/^trae-//')"
            gh secret set "$name" --body "$(cat "$f")"
            echo "已更新 Secret: $name"
          done

      - name: 清理凭证
        if: always()
        run: rm -rf auths
